<div class="flex flex-col h-screen bg-slate-50 dark:bg-[#07051a] overflow-hidden font-sans text-slate-900 dark:text-slate-100">
  <app-header></app-header>
  <main class="flex-1 overflow-y-auto pb-16 scroll-smooth">
    <div class="max-w-[1000px] mx-auto px-6 py-8">
      <div class="mb-8 animate-fade-in-up">
        <h2 class="text-3xl font-extrabold tracking-tight mb-2">Access Management</h2>
        <p class="text-slate-500 dark:text-slate-400">Grant or revoke Azure and AWS access for users who have signed in.</p>
      </div>

      <div *ngIf="error" class="admin-alert animate-fade-in-up">{{ error }}</div>

      <div *ngIf="loading" class="text-center py-20 text-slate-400">Loading users&hellip;</div>

      <div *ngIf="!loading && users.length === 0" class="text-center py-20 text-slate-400">
        No one has signed in yet.
      </div>

      <div *ngIf="!loading && users.length > 0" class="admin-table-card animate-fade-in-up" style="animation-delay: 80ms">
        <table class="admin-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Role</th>
              <th class="text-center">Azure</th>
              <th class="text-center">AWS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>
                <div class="flex items-center">
                  <div class="admin-avatar">{{ (user.name || user.email).charAt(0) | uppercase }}</div>
                  <div class="ml-3">
                    <div class="font-semibold text-sm">{{ user.name || user.email }}</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400">{{ user.email }}</div>
                  </div>
                </div>
              </td>
              <td>
                <span *ngIf="user.isAdmin" class="admin-role-pill">Admin</span>
                <span *ngIf="!user.isAdmin" class="text-sm text-slate-400">Member</span>
              </td>
              <td class="text-center">
                <input
                  type="checkbox"
                  class="admin-checkbox"
                  [checked]="user.access.azure"
                  [disabled]="savingEmail === user.email"
                  (change)="toggleAccess(user, 'azure')">
              </td>
              <td class="text-center">
                <input
                  type="checkbox"
                  class="admin-checkbox"
                  [checked]="user.access.aws"
                  [disabled]="savingEmail === user.email"
                  (change)="toggleAccess(user, 'aws')">
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
